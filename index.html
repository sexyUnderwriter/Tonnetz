<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tonnetz Grid - Orchestral Ranges</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#b5472f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tonnetz" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <style>
    :root {
      --paper: #f4f1e8;
      --ink: #1f2833;
      --ink-soft: #4d5a66;
      --accent: #b5472f;
      --basset-accent: #6a4c93;
      --alto-accent: #2f7d8c;
      --soprano-accent: #7d5a2f;
      --violin-accent: #5c6bc0;
      --viola-accent: #8d6e63;
      --cello-accent: #2e7d32;
      --bass-accent: #6a1b9a;
      --flute-accent: #00897b;
      --oboe-accent: #c2185b;
      --clarinet-accent: #ef6c00;
      --bassoon-accent: #455a64;
      --horn-accent: #1976d2;
      --trumpet-accent: #d32f2f;
      --trombone-accent: #5d4037;
      --tuba-accent: #7b1fa2;
      --harp-accent: #f9a825;
      --line: #8f9da6;
      --line-soft: #b8c1c7;
      --note-fill: #faf8f2;
      --edge-fade: #d7dee2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 18% 14%, rgba(181, 71, 47, 0.08) 0%, rgba(181, 71, 47, 0) 40%),
        radial-gradient(circle at 78% 88%, rgba(42, 107, 123, 0.08) 0%, rgba(42, 107, 123, 0) 42%),
        linear-gradient(150deg, #f7f3ea 0%, #ece6d9 100%);
      font-family: "EB Garamond", "Palatino Linotype", Palatino, serif;
      color: var(--ink);
      overflow: auto;
      /* Prevent pull-to-refresh and bounce scroll interfering with the grid */
      overscroll-behavior: none;
    }

    .frame {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(0, 0.9fr);
      grid-template-areas:
        "page-title page-title"
        "controls controls"
        "tonnetz scores";
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 12px;
      width: 100%;
      min-height: 100%;
      /* Respect notch / home indicator safe areas */
      padding: clamp(10px, 1.2vw, 18px);
      padding-left: max(clamp(10px, 1.4vw, 22px), env(safe-area-inset-left));
      padding-right: max(clamp(10px, 1.4vw, 22px), env(safe-area-inset-right));
      padding-bottom: max(clamp(10px, 1.4vw, 22px), env(safe-area-inset-bottom));
    }

    .page-header {
      grid-area: page-title;
      padding: 2px 2px 0;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(18px, 2vw, 30px);
      letter-spacing: 0.02em;
      color: var(--ink);
      font-weight: 600;
    }

    .tonnetz-stage {
      grid-area: tonnetz;
      position: relative;
      width: 100%;
      height: clamp(860px, calc(100vh - 180px), 1500px);
      min-height: 860px;
    }

    .path-controls {
      grid-area: controls;
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      width: 100%;
      margin: 0;
      background: rgba(244, 241, 232, 0.95);
      border: 1px solid rgba(31, 40, 51, 0.22);
      border-radius: 10px;
      padding: 8px 10px;
      box-shadow: 0 6px 16px rgba(18, 23, 28, 0.1);
    }

    .path-controls label {
      font-size: 12px;
      color: #4f5b67;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .instrument-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px;
      margin-left: 2px;
    }

    .instrument-controls select {
      min-width: 220px;
      max-width: min(100%, 320px);
      font-family: inherit;
      font-size: 12px;
      color: #1f2833;
      background: #fffdf7;
      border: 1px solid rgba(31, 40, 51, 0.32);
      border-radius: 6px;
      padding: 6px 8px;
      min-height: 36px;
      touch-action: manipulation;
    }

    .path-controls select,
    .path-controls button {
      font-family: inherit;
      font-size: 12px;
      color: #1f2833;
      background: #fffdf7;
      border: 1px solid rgba(31, 40, 51, 0.32);
      border-radius: 6px;
      padding: 6px 10px;
      min-height: 36px;
      /* Prevent double-tap zoom delay on controls */
      touch-action: manipulation;
    }

    .path-controls input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .path-controls button {
      cursor: pointer;
    }

    .tempo-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 2px;
    }

    .tempo-wrap input {
      width: 54px;
      font-family: inherit;
      font-size: 12px;
      color: #1f2833;
      background: #fffdf7;
      border: 1px solid rgba(31, 40, 51, 0.32);
      border-radius: 6px;
      padding: 6px 6px;
      min-height: 36px;
      touch-action: manipulation;
    }

    .score-panel {
      position: relative;
      width: 100%;
      max-width: 100%;
      background: rgba(244, 241, 232, 0.95);
      border: 1px solid rgba(31, 40, 51, 0.22);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 6px 16px rgba(18, 23, 28, 0.1);
    }

    .score-grid {
      grid-area: scores;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: min(88vh, 1200px);
      min-height: 720px;
      align-self: stretch;
    }

    .score-panel {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 220px;
    }

    .score-title {
      font-size: 12px;
      color: #4f5b67;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin: 0 0 6px 2px;
    }

    .score-preview {
      width: 100%;
      min-height: 220px;
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      overflow: auto;
      background: #fffdf7;
      border: 1px solid rgba(31, 40, 51, 0.3);
      border-radius: 8px;
      padding: 10px 8px 8px;
      transform: scale(0.92);
      transform-origin: top left;
    }

    .score-status {
      font-size: 13px;
      fill: #3f4d59;
      color: #3f4d59;
      text-align: center;
      padding: 0 8px;
    }

    #tonnetz {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--paper);
      border: 1px solid rgba(31, 40, 51, 0.16);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 18px 40px rgba(18, 23, 28, 0.12);
      /* Prevent browser pan/zoom from intercepting touch events on the SVG */
      touch-action: none;
      /* Suppress the blue tap-flash on iOS */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .title {
      font-size: clamp(18px, 2.2vw, 30px);
      font-weight: 600;
      letter-spacing: 0.02em;
      fill: var(--ink);
    }

    .subtitle {
      font-size: clamp(11px, 1.2vw, 15px);
      letter-spacing: 0.06em;
      fill: var(--ink-soft);
      text-transform: uppercase;
    }

    .tri-line {
      stroke: var(--line-soft);
      stroke-width: 1.05;
    }

    .tri-line-strong {
      stroke: var(--line);
      stroke-width: 1.45;
    }

    .node {
      fill: var(--note-fill);
      stroke: rgba(31, 40, 51, 0.36);
      stroke-width: 0.95;
      pointer-events: all;
      touch-action: none;
      transition: opacity 120ms ease, stroke-width 120ms ease, fill 120ms ease;
    }

    .node-hit-target {
      fill: transparent;
      cursor: pointer;
      pointer-events: all;
      touch-action: none;
    }

    .node-muted {
      opacity: 0.2;
    }

    .node-match {
      stroke: #16212c;
      stroke-width: 1.85;
      fill: #fffaf0;
    }

    .node-selected {
      stroke: #111a22;
      stroke-width: 2.5;
      fill: #ffeccf;
    }

    .node-path {
      stroke: #0f1720;
      stroke-width: 1.7;
      fill: #fff9ee;
    }

    .node-start {
      stroke: #0a1118;
      stroke-width: 2.8;
      fill: #ffe3c4;
    }

    .node-end {
      stroke: #0a1118;
      stroke-width: 2.8;
      fill: #d8eaf0;
    }

    .node-waypoint {
      stroke: #16212c;
      stroke-width: 2.2;
      fill: #f7ecd8;
    }

    .range-ring {
      fill: none;
      stroke-width: 2.1;
      opacity: 0.96;
      transition: opacity 120ms ease, stroke-width 120ms ease;
    }

    .range-ring-muted {
      opacity: 0.12;
    }

    .range-ring-match {
      opacity: 1;
      stroke-width: 2.45;
    }

    .range-ring-selected {
      opacity: 1;
      stroke-width: 2.8;
    }

    .range-ring-path {
      opacity: 1;
      stroke-width: 2.6;
    }

    .range-ring-tenor {
      stroke: var(--accent);
    }

    .range-ring-basset {
      stroke: var(--basset-accent);
    }

    .range-ring-alto {
      stroke: var(--alto-accent);
    }

    .range-ring-soprano {
      stroke: var(--soprano-accent);
    }

    .range-ring-violin {
      stroke: var(--violin-accent);
    }

    .range-ring-viola {
      stroke: var(--viola-accent);
    }

    .range-ring-cello {
      stroke: var(--cello-accent);
    }

    .range-ring-bass {
      stroke: var(--bass-accent);
    }

    .range-ring-flute {
      stroke: var(--flute-accent);
    }

    .range-ring-oboe {
      stroke: var(--oboe-accent);
    }

    .range-ring-clarinet {
      stroke: var(--clarinet-accent);
    }

    .range-ring-bassoon {
      stroke: var(--bassoon-accent);
    }

    .range-ring-horn {
      stroke: var(--horn-accent);
    }

    .range-ring-trumpet {
      stroke: var(--trumpet-accent);
    }

    .range-ring-trombone {
      stroke: var(--trombone-accent);
    }

    .range-ring-tuba {
      stroke: var(--tuba-accent);
    }

    .range-ring-harp {
      stroke: var(--harp-accent);
    }

    .label {
      font-size: clamp(12px, 1.2vw, 16px);
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: central;
      font-weight: 600;
      letter-spacing: 0.01em;
      pointer-events: none;
      transition: opacity 120ms ease, fill 120ms ease;
    }

    .label-muted {
      opacity: 0.22;
    }

    .label-match {
      fill: #121b24;
    }

    .label-selected {
      fill: #000;
      font-weight: 700;
    }

    .label-path {
      fill: #111a22;
      font-weight: 700;
    }

    .label-start,
    .label-end {
      fill: #000;
      font-weight: 700;
    }

    .label-waypoint {
      fill: #18222d;
      font-weight: 700;
    }

    .edge-muted {
      opacity: 0.22;
    }

    .path-edge-active {
      stroke: #243447;
      stroke-width: 2.7;
      opacity: 1;
    }

    .edge-fade {
      stroke: var(--edge-fade);
      stroke-width: 1;
      fill: none;
      stroke-dasharray: 2 4;
    }

    .footer {
      font-size: clamp(11px, 1vw, 13px);
      fill: #68747f;
      letter-spacing: 0.035em;
    }

    .legend-label {
      font-size: clamp(12px, 1.05vw, 14px);
      fill: #5e6973;
      letter-spacing: 0.025em;
      dominant-baseline: central;
    }

    .interaction-note {
      font-size: clamp(12px, 1.05vw, 14px);
      fill: #56626d;
      letter-spacing: 0.03em;
    }

    .tri-face {
      fill: transparent;
      stroke: transparent;
      stroke-width: 16;
      pointer-events: all;
      touch-action: none;
      cursor: default;
      transition: fill 120ms ease, stroke 120ms ease, opacity 120ms ease;
    }

    .mode-triad .tri-face {
      stroke: rgba(181, 71, 47, 0.22);
      stroke-width: 1;
      cursor: pointer;
    }

    .mode-triad .tri-face:hover {
      fill: rgba(181, 71, 47, 0.10);
      stroke: rgba(181, 71, 47, 0.50);
    }

    .tri-face-selected {
      fill: rgba(181, 71, 47, 0.16);
      stroke: rgba(31, 40, 51, 0.58);
      stroke-width: 1.4;
    }

    .triad-label {
      font-size: clamp(9px, 0.9vw, 12px);
      fill: rgba(31, 40, 51, 0.68);
      text-anchor: middle;
      dominant-baseline: middle;
      font-weight: 600;
      letter-spacing: 0.01em;
      pointer-events: none;
      transition: fill 120ms ease;
    }

    .triad-label-selected {
      fill: #111a22;
      font-weight: 700;
    }

    @media (max-width: 1100px) {
      .frame {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "page-title"
          "controls"
          "tonnetz"
          "scores";
      }

      .tonnetz-stage,
      .score-grid {
        min-height: 460px;
        height: auto;
      }

      .score-panel {
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="page-header">
      <h1>Tonnetz - Orchestral Range Field</h1>
    </div>
    <div class="tonnetz-stage">
      <svg id="tonnetz" viewBox="0 0 2200 1400" role="img" aria-label="Tonnetz triangle grid centered on middle C with selectable orchestral instrument ranges">
        <defs>
          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#101923" flood-opacity="0.2" />
          </filter>
        </defs>
      </svg>
    </div>
    <div class="path-controls" aria-label="Path guide controls">
      <label for="interactionMode">Mode</label>
      <select id="interactionMode">
        <option value="route">Route</option>
        <option value="triad">Triad</option>
      </select>
      <label for="pathMode">Path</label>
      <select id="pathMode">
        <option value="shortest">Shortest</option>
        <option value="smooth">Smooth voice-leading</option>
        <option value="tension">Tension-increase</option>
      </select>
      <button id="clearPath" type="button">Clear</button>
      <button id="playRoute" type="button">Play</button>
      <button id="stopRoute" type="button">Stop</button>
      <label for="playbackSource">Play</label>
      <select id="playbackSource">
        <option value="route">Route staff</option>
        <option value="triad">Triad staff</option>
      </select>
      <label for="romanNumeralsToggle">Roman</label>
      <input id="romanNumeralsToggle" type="checkbox" aria-label="Display triad labels as Roman numerals" />
      <label for="romanRootSelect">Root</label>
      <select id="romanRootSelect" aria-label="Roman numeral root" disabled>
        <option value="0" selected>C</option>
        <option value="1">C#</option>
        <option value="2">D</option>
        <option value="3">Eb</option>
        <option value="4">E</option>
        <option value="5">F</option>
        <option value="6">F#</option>
        <option value="7">G</option>
        <option value="8">Ab</option>
        <option value="9">A</option>
        <option value="10">Bb</option>
        <option value="11">B</option>
      </select>
      <div class="instrument-controls">
        <label for="instrumentSelection">Instruments</label>
        <select id="instrumentSelection" multiple size="6" aria-label="Select orchestral instruments">
          <option value="violin" selected>Violin</option>
          <option value="viola" selected>Viola</option>
          <option value="cello" selected>Cello</option>
          <option value="bass">Double bass</option>
          <option value="flute" selected>Flute</option>
          <option value="soprano-recorder">Soprano recorder</option>
          <option value="alto-recorder">Alto recorder</option>
          <option value="tenor-recorder">Tenor recorder</option>
          <option value="bass-recorder">Bass recorder</option>
          <option value="oboe">Oboe</option>
          <option value="clarinet">Clarinet</option>
          <option value="bassoon">Bassoon</option>
          <option value="horn" selected>Horn</option>
          <option value="trumpet">Trumpet</option>
          <option value="trombone">Trombone</option>
          <option value="tuba">Tuba</option>
          <option value="harp">Harp</option>
        </select>
      </div>
      <div class="tempo-wrap">
        <label for="tempoBpm">BPM</label>
        <input id="tempoBpm" type="number" min="40" max="220" value="84" />
      </div>
    </div>
    <div class="score-grid" aria-label="Rendered score preview panels">
      <div class="score-panel" aria-label="Rendered route score preview panel">
        <p class="score-title">Rendered route score (whole notes)</p>
        <div id="scorePreview" class="score-preview" role="img" aria-label="Rendered whole-note route score preview">
          <div class="score-status">Select a path to render the route staff.</div>
        </div>
      </div>
      <div class="score-panel" aria-label="Rendered triad score preview panel">
        <p class="score-title">Rendered triad score (separate staff)</p>
        <div id="triadPreview" class="score-preview" role="img" aria-label="Rendered whole-note triad score preview">
          <div class="score-status">Switch to Triad mode and tap triangles to render the triad staff.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.2/build/opensheetmusicdisplay.min.js"></script>
  <script>
    (function drawTonnetz() {
      const svg = document.getElementById("tonnetz");
      const pathModeSelect = document.getElementById("pathMode");
      const interactionModeSelect = document.getElementById("interactionMode");
      const clearPathButton = document.getElementById("clearPath");
      const playRouteButton = document.getElementById("playRoute");
      const stopRouteButton = document.getElementById("stopRoute");
      const tempoBpmInput = document.getElementById("tempoBpm");
      const playbackSourceSelect = document.getElementById("playbackSource");
      const romanNumeralsToggle = document.getElementById("romanNumeralsToggle");
      const romanRootSelect = document.getElementById("romanRootSelect");
      const scorePreview = document.getElementById("scorePreview");
      const triadPreview = document.getElementById("triadPreview");
      const width = 2200;
      const height = 1400;
      const HEADER_BAND = 40;
      const SIDE_MARGIN = 12;
      const BOTTOM_MARGIN = 22;

      const instrumentDefinitions = [
        { key: "violin", label: "Violin", minMidi: 55, maxMidi: 88, colorClass: "range-ring-violin", accentVar: "--violin-accent" },
        { key: "viola", label: "Viola", minMidi: 48, maxMidi: 81, colorClass: "range-ring-viola", accentVar: "--viola-accent" },
        { key: "cello", label: "Cello", minMidi: 36, maxMidi: 72, colorClass: "range-ring-cello", accentVar: "--cello-accent" },
        { key: "bass", label: "Double bass", minMidi: 28, maxMidi: 60, colorClass: "range-ring-bass", accentVar: "--bass-accent" },
        { key: "flute", label: "Flute", minMidi: 60, maxMidi: 84, colorClass: "range-ring-flute", accentVar: "--flute-accent" },
        { key: "soprano-recorder", label: "Soprano recorder", minMidi: 60, maxMidi: 84, colorClass: "range-ring-soprano", accentVar: "--soprano-accent" },
        { key: "alto-recorder", label: "Alto recorder", minMidi: 53, maxMidi: 77, colorClass: "range-ring-alto", accentVar: "--alto-accent" },
        { key: "tenor-recorder", label: "Tenor recorder", minMidi: 48, maxMidi: 72, colorClass: "range-ring-tenor", accentVar: "--tenor-accent" },
        { key: "bass-recorder", label: "Bass recorder", minMidi: 41, maxMidi: 65, colorClass: "range-ring-basset", accentVar: "--basset-accent" },
        { key: "oboe", label: "Oboe", minMidi: 58, maxMidi: 82, colorClass: "range-ring-oboe", accentVar: "--oboe-accent" },
        { key: "clarinet", label: "Clarinet", minMidi: 50, maxMidi: 79, colorClass: "range-ring-clarinet", accentVar: "--clarinet-accent" },
        { key: "bassoon", label: "Bassoon", minMidi: 34, maxMidi: 67, colorClass: "range-ring-bassoon", accentVar: "--bassoon-accent" },
        { key: "horn", label: "Horn", minMidi: 45, maxMidi: 77, colorClass: "range-ring-horn", accentVar: "--horn-accent" },
        { key: "trumpet", label: "Trumpet", minMidi: 56, maxMidi: 83, colorClass: "range-ring-trumpet", accentVar: "--trumpet-accent" },
        { key: "trombone", label: "Trombone", minMidi: 37, maxMidi: 71, colorClass: "range-ring-trombone", accentVar: "--trombone-accent" },
        { key: "tuba", label: "Tuba", minMidi: 29, maxMidi: 60, colorClass: "range-ring-tuba", accentVar: "--tuba-accent" },
        { key: "harp", label: "Harp", minMidi: 32, maxMidi: 76, colorClass: "range-ring-harp", accentVar: "--harp-accent" }
      ];

      const instrumentSelection = document.getElementById("instrumentSelection");
      const selectionStorageKey = "tonnetz-instrument-selection";

      function selectedInstrumentKeys() {
        return Array.from(instrumentSelection.selectedOptions).map((option) => option.value);
      }

      function persistInstrumentSelection() {
        try {
          window.sessionStorage.setItem(selectionStorageKey, JSON.stringify(selectedInstrumentKeys()));
        } catch (error) {
          // Ignore storage failures in privacy-restricted browsers.
        }
      }

      function restoreInstrumentSelection() {
        try {
          const stored = window.sessionStorage.getItem(selectionStorageKey);
          if (!stored) {
            return;
          }
          const storedKeys = JSON.parse(stored);
          if (!Array.isArray(storedKeys)) {
            return;
          }
          Array.from(instrumentSelection.options).forEach((option) => {
            option.selected = storedKeys.includes(option.value);
          });
        } catch (error) {
          // Ignore invalid stored selections.
        }
      }

      function activeInstruments() {
        return instrumentDefinitions.filter((instrument) => selectedInstrumentKeys().includes(instrument.key));
      }

      const GRID_MIN_MIDI = Math.min(...instrumentDefinitions.map((instrument) => instrument.minMidi));
      const GRID_MAX_MIDI = Math.max(...instrumentDefinitions.map((instrument) => instrument.maxMidi));

      const CENTER_X = width / 2;
      const CENTER_Y = (HEADER_BAND + (height - BOTTOM_MARGIN)) / 2;
      const SPACING = 118;
      const SQRT3 = Math.sqrt(3);
      const RADIUS = 28;

      const pitchNames = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
      const romanNumeralsByInterval = ["I", "bII", "II", "bIII", "III", "IV", "bV", "V", "bVI", "VI", "bVII", "VII"];
      const musicXmlPitchMap = [
        { step: "C", alter: 0 },
        { step: "C", alter: 1 },
        { step: "D", alter: 0 },
        { step: "E", alter: -1 },
        { step: "E", alter: 0 },
        { step: "F", alter: 0 },
        { step: "F", alter: 1 },
        { step: "G", alter: 0 },
        { step: "A", alter: -1 },
        { step: "A", alter: 0 },
        { step: "B", alter: -1 },
        { step: "B", alter: 0 }
      ];

      function midiToName(midi) {
        const pc = ((midi % 12) + 12) % 12;
        const octave = Math.floor(midi / 12) - 1;
        return pitchNames[pc] + octave;
      }

      function midiToMusicXmlPitch(midi) {
        const pc = ((midi % 12) + 12) % 12;
        const relativeToMiddleC = midi - 60;
        const octave = 4 + Math.floor(relativeToMiddleC / 12);
        const pitch = musicXmlPitchMap[pc];
        return {
          step: pitch.step,
          alter: pitch.alter,
          octave
        };
      }

      function midiToPitchClassName(midi) {
        const pc = ((midi % 12) + 12) % 12;
        return pitchNames[pc];
      }

      function detectTriadQuality(pcs, rootPc) {
        const intervals = pcs.map((pc) => ((pc - rootPc) + 12) % 12);
        const has = (target) => intervals.includes(target);

        if (has(0) && has(4) && has(7)) {
          return "";
        }
        if (has(0) && has(3) && has(7)) {
          return "m";
        }
        if (has(0) && has(3) && has(6)) {
          return "dim";
        }
        if (has(0) && has(4) && has(8)) {
          return "aug";
        }
        return null;
      }

      function buildTriadChordLabel(nodeKeys) {
        const triadData = analyzeTriad(nodeKeys);
        if (!triadData) {
          const triadNodes = nodeKeys.map((nodeKey) => nodes.get(nodeKey)).filter(Boolean);
          return triadNodes.map((node) => midiToPitchClassName(node.midi)).join("-");
        }
        const { rootPc, quality, bassPc } = triadData;
        const rootName = pitchNames[rootPc];
        const bassName = pitchNames[bassPc];
        const baseSymbol = `${rootName}${quality}`;
        if (bassPc === rootPc) {
          return baseSymbol;
        }
        return `${baseSymbol}/${bassName}`;
      }

      function analyzeTriad(nodeKeys) {
        const triadNodes = nodeKeys.map((nodeKey) => nodes.get(nodeKey)).filter(Boolean);
        if (triadNodes.length < 3) {
          return null;
        }

        const bassPc = ((triadNodes[0].midi % 12) + 12) % 12;
        const uniquePcs = Array.from(new Set(triadNodes.map((node) => ((node.midi % 12) + 12) % 12)));

        let rootPc = null;
        let quality = null;
        uniquePcs.forEach((candidatePc) => {
          if (quality !== null) {
            return;
          }
          const detected = detectTriadQuality(uniquePcs, candidatePc);
          if (detected !== null) {
            rootPc = candidatePc;
            quality = detected;
          }
        });

        if (rootPc === null || quality === null) {
          return null;
        }

        return { rootPc, quality, bassPc };
      }

      function buildTriadRomanNumeralLabel(nodeKeys) {
        const triadData = analyzeTriad(nodeKeys);
        if (!triadData) {
          return buildTriadChordLabel(nodeKeys);
        }
        const { rootPc, quality, bassPc } = triadData;
        const romanRootPc = Number(romanRootSelect?.value ?? "0");
        const rootInterval = ((rootPc - romanRootPc) + 12) % 12;
        const bassInterval = ((bassPc - romanRootPc) + 12) % 12;
        const degree = romanNumeralsByInterval[rootInterval];
        let baseSymbol = degree;
        if (quality === "m") {
          baseSymbol = degree.toLowerCase();
        } else if (quality === "dim") {
          baseSymbol = `${degree.toLowerCase()}°`;
        } else if (quality === "aug") {
          baseSymbol = `${degree}+`;
        }
        if (bassPc === rootPc) {
          return baseSymbol;
        }
        return `${baseSymbol}/${romanNumeralsByInterval[bassInterval]}`;
      }

      function formatTriadLabel(nodeKeys) {
        if (romanNumeralsToggle && romanNumeralsToggle.checked) {
          return buildTriadRomanNumeralLabel(nodeKeys);
        }
        return buildTriadChordLabel(nodeKeys);
      }

      function buildMeasureContent(measureNumber, midis, clefSign, clefLine, includeAttributes = false) {
        const measure = [`    <measure number="${measureNumber}">`];
        if (includeAttributes) {
          measure.push(
            '      <attributes>',
            '        <divisions>1</divisions>',
            '        <key><fifths>0</fifths></key>',
            '        <time><beats>4</beats><beat-type>4</beat-type></time>',
            `        <clef><sign>${clefSign}</sign><line>${clefLine}</line></clef>`,
            '      </attributes>'
          );
        }

        if (midis.length === 0) {
          measure.push(
            '      <note>',
            '        <rest/>',
            '        <duration>4</duration>',
            '        <type>whole</type>',
            '      </note>'
          );
        } else {
          midis.forEach((midi, noteIndex) => {
            const pitch = midiToMusicXmlPitch(midi);
            measure.push('      <note>');
            if (noteIndex > 0) {
              measure.push('        <chord/>');
            }
            measure.push(
              '        <pitch>',
              `          <step>${pitch.step}</step>`
            );

            if (pitch.alter !== 0) {
              measure.push(`          <alter>${pitch.alter}</alter>`);
            }

            measure.push(
              `          <octave>${pitch.octave}</octave>`,
              '        </pitch>',
              '        <duration>4</duration>',
              '        <type>whole</type>',
              '      </note>'
            );
          });
        }

        measure.push('    </measure>');
        return measure;
      }

      function buildGrandStaffMusicXml(title, measures) {
        const partMeasures = [
          measures.map((entry, index) => buildMeasureContent(index + 1, entry.treble || [], 'G', 2, index === 0)),
          measures.map((entry, index) => buildMeasureContent(index + 1, entry.bass || [], 'F', 4, index === 0))
        ];

        const maxMeasureCount = Math.max(...partMeasures.map((part) => part.length));
        const paddedParts = partMeasures.map((partMeasuresForStaff, partIndex) => {
          if (partMeasuresForStaff.length >= maxMeasureCount) {
            return partMeasuresForStaff.flat();
          }
          const clefSign = partIndex === 0 ? 'G' : 'F';
          const clefLine = partIndex === 0 ? 2 : 4;
          const missingMeasures = maxMeasureCount - partMeasuresForStaff.length;
          const paddingMeasures = Array.from({ length: missingMeasures }, (_, index) => buildMeasureContent(partMeasuresForStaff.length + index + 1, [], clefSign, clefLine, false));
          return [...partMeasuresForStaff.flat(), ...paddingMeasures.flat()];
        });

        return [
          '<?xml version="1.0" encoding="UTF-8"?>',
          '<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">',
          '<score-partwise version="3.1">',
          '  <part-list>',
          '    <part-group type="start" number="1">',
          '      <group-symbol>brace</group-symbol>',
          '      <group-barline>yes</group-barline>',
          '    </part-group>',
          '    <score-part id="P1"/>',
          '    <score-part id="P2"/>',
          '    <part-group type="stop" number="1"/>',
          '  </part-list>',
          '  <part id="P1">',
          ...paddedParts[0],
          '  </part>',
          '  <part id="P2">',
          ...paddedParts[1],
          '  </part>',
          '</score-partwise>'
        ].join('\n');
      }

      function buildRouteMusicXmlFromKeys(noteKeys) {
        const selectedNodes = noteKeys.map((key) => nodes.get(key)).filter(Boolean);
        const measures = selectedNodes.length === 0
          ? [{ treble: [], bass: [] }]
          : selectedNodes.map((node) => node.midi >= 60
              ? { treble: [node.midi], bass: [] }
              : { treble: [], bass: [node.midi] });

        return buildGrandStaffMusicXml('Tonnetz Route', measures);
      }

      function buildTriadMusicXmlFromTriangles(triangleKeys) {
        const triads = triangleKeys
          .map((triangleKey) => trianglesById.get(triangleKey))
          .filter(Boolean)
          .map((triangle) => {
            const uniqueMidis = Array.from(
              new Set(triangle.nodeKeys.map((nodeKey) => nodes.get(nodeKey)).filter(Boolean).map((node) => node.midi))
            );
            uniqueMidis.sort((a, b) => a - b);
            return uniqueMidis;
          })
          .filter((midis) => midis.length > 0);

        const measures = triads.length === 0
          ? [{ treble: [], bass: [] }]
          : triads.map((midis) => ({
              treble: midis.filter((midi) => midi >= 60),
              bass: midis.filter((midi) => midi < 60)
            }));

        return buildGrandStaffMusicXml('Tonnetz Triads', measures);
      }

      let routeOsmd = null;
      let triadOsmd = null;

      function setScoreStatus(targetElement, message) {
        targetElement.innerHTML = `<div class="score-status">${message}</div>`;
      }

      function ensureOsmd(target) {
        if (!window.opensheetmusicdisplay || !window.opensheetmusicdisplay.OpenSheetMusicDisplay) {
          setScoreStatus(scorePreview, "MusicXML renderer not available. Check network/CDN access.");
          setScoreStatus(triadPreview, "MusicXML renderer not available. Check network/CDN access.");
          return false;
        }

        if (target === "route" && !routeOsmd) {
          routeOsmd = new window.opensheetmusicdisplay.OpenSheetMusicDisplay(scorePreview, {
            autoResize: false,
            drawTitle: false,
            drawPartNames: false,
            drawPartAbbreviations: false,
            backend: "svg",
            drawingParameters: {
              defaultFontFamily: "Times New Roman",
              staffLineWidth: 0.8,
              noteheadWidth: 9,
              noteheadHeight: 8
            },
            renderSinglePart: true,
            disableAutoBeam: true
          });
        }

        if (target === "triad" && !triadOsmd) {
          triadOsmd = new window.opensheetmusicdisplay.OpenSheetMusicDisplay(triadPreview, {
            autoResize: false,
            drawTitle: false,
            drawPartNames: false,
            drawPartAbbreviations: false,
            backend: "svg",
            drawingParameters: {
              defaultFontFamily: "Times New Roman",
              staffLineWidth: 0.8,
              noteheadWidth: 9,
              noteheadHeight: 8
            },
            renderSinglePart: true,
            disableAutoBeam: true
          });
        }

        return true;
      }

      function removePartLabels(targetElement) {
        const svg = targetElement.querySelector("svg");
        if (!svg) {
          return;
        }

        const textNodes = Array.from(svg.querySelectorAll("text"));
        textNodes.forEach((textNode) => {
          const labelText = (textNode.textContent || "").trim();
          const className = (textNode.getAttribute("class") || "").toLowerCase();
          if (!labelText) {
            return;
          }

          if (
            labelText === "P1" ||
            labelText === "P2" ||
            className.includes("part-name") ||
            className.includes("part-abbreviation") ||
            className.includes("partlabel")
          ) {
            textNode.remove();
          }
        });
      }

      async function renderRouteMusicXmlFromKeys(noteKeys) {
        const xml = buildRouteMusicXmlFromKeys(noteKeys);
        if (!ensureOsmd("route")) {
          return;
        }

        try {
          await routeOsmd.load(xml);
          routeOsmd.render();
          removePartLabels(scorePreview);
        } catch (error) {
          setScoreStatus(scorePreview, "Unable to render route MusicXML from current selection.");
        }
      }

      async function renderTriadMusicXmlFromTriangleKeys(triangleKeys) {
        const xml = buildTriadMusicXmlFromTriangles(triangleKeys);
        if (!ensureOsmd("triad")) {
          return;
        }

        try {
          await triadOsmd.load(xml);
          triadOsmd.render();
          removePartLabels(triadPreview);
        } catch (error) {
          setScoreStatus(triadPreview, "Unable to render triad MusicXML from current selection.");
        }
      }

      function uvToPoint(u, v) {
        const x = CENTER_X + SPACING * (u + 0.5 * v);
        const y = CENTER_Y - SPACING * (SQRT3 / 2) * v;
        return { x, y };
      }

      function inBounds(x, y) {
        return x > SIDE_MARGIN && x < width - SIDE_MARGIN && y > HEADER_BAND && y < height - BOTTOM_MARGIN;
      }

      let nodes = new Map();
      let edgePairs = [];
      let adjacency = new Map();
      let trianglesById = new Map();
      let triangleGroup = null;
      let triadTextGroup = null;
      let edgeGroup = null;
      let nodeGroup = null;
      let rangeGroup = null;
      let textGroup = null;
      let hitGroup = null;
      let nodeVisuals = [];
      let triangleVisuals = [];
      let edgeVisuals = [];
      let visualByKey = new Map();
      let interactionNote = null;
      let maxRadius = 0;
      let graphRenderFrame = null;
      let activeMode = "route";
      let selectedNodeKeys = [];
      let activePathKeys = [];
      let selectedTriangleIds = [];
      let routePlaybackEvents = [];
      let triadPlaybackEvents = [];
      let highlightedNoteName = null;
      let previewNoteName = null;
      function currentInteractionMode() {
        return interactionModeSelect && interactionModeSelect.value ? interactionModeSelect.value : "route";
      }
      const searchExtent = 16;
      const directions = [
        [1, 0],
        [0, 1],
        [1, -1]
      ];

      function nodeAt(u, v) {
        return nodes.get(`${u},${v}`);
      }

      function pairKey(aKey, bKey) {
        return aKey < bKey ? `${aKey}|${bKey}` : `${bKey}|${aKey}`;
      }

      function addNeighbor(aKey, bKey) {
        if (!adjacency.has(aKey)) {
          adjacency.set(aKey, []);
        }
        adjacency.get(aKey).push(bKey);
      }

      function bindNodeInteractions() {
        nodeVisuals.forEach((visual) => {
          visual.core.addEventListener("mouseover", () => showPreviewForVisual(visual));
          visual.core.addEventListener("mouseout", clearPreviewForVisual);
          visual.core.addEventListener("pointerover", () => showPreviewForVisual(visual));
          visual.core.addEventListener("pointerout", clearPreviewForVisual);
          visual.core.addEventListener("touchstart", (event) => {
            showPreviewForVisual(visual);
            handleNodeSelection(event, visual);
          }, { passive: false });
          visual.core.addEventListener("pointerdown", (event) => handleNodeSelection(event, visual));
          visual.hitTarget.addEventListener("mouseover", () => showPreviewForVisual(visual));
          visual.hitTarget.addEventListener("mouseout", clearPreviewForVisual);
          visual.hitTarget.addEventListener("pointerover", () => showPreviewForVisual(visual));
          visual.hitTarget.addEventListener("pointerout", clearPreviewForVisual);
          visual.hitTarget.addEventListener("touchstart", (event) => {
            showPreviewForVisual(visual);
            handleNodeSelection(event, visual);
          }, { passive: false });
          visual.hitTarget.addEventListener("pointerdown", (event) => handleNodeSelection(event, visual));
        });
      }

      function bindTriangleInteractions() {
        triangleVisuals.forEach((triangleVisual) => {
          triangleVisual.polygon.addEventListener("pointerdown", (event) => {
            if (currentInteractionMode() !== "triad" && !event.shiftKey) {
              interactionNote.textContent = "Switch to Triad mode (or Shift-click) to add a triangle to the triad staff.";
              return;
            }

            event.stopPropagation();

            const id = triangleVisual.id;
            const alreadySelected = selectedTriangleIds.includes(id);
            if (alreadySelected) {
              selectedTriangleIds = selectedTriangleIds.filter((triangleId) => triangleId !== id);
            } else {
              selectedTriangleIds.push(id);
            }

            updateTriadView();
          });
        });
      }

      function scheduleGraphRender() {
        if (graphRenderFrame !== null) {
          window.cancelAnimationFrame(graphRenderFrame);
        }
        graphRenderFrame = window.requestAnimationFrame(() => {
          graphRenderFrame = null;
          renderGraph();
        });
      }

      function renderGraph() {
        try {
          if (typeof window.__tonnetzRenderGraph === "function") {
            window.__tonnetzRenderGraph();
            return;
          }

          const defs = svg.querySelector("defs");
          svg.replaceChildren(defs);

          const previousMode = currentInteractionMode();

          triangleGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        triadTextGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        edgeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        rangeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        textGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        hitGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        nodeVisuals = [];
        triangleVisuals = [];
        edgeVisuals = [];
        adjacency = new Map();
        trianglesById = new Map();
        visualByKey = new Map();
        nodes = new Map();

        const activeSelectedInstruments = activeInstruments();
        const gridMinMidi = Math.min(...activeSelectedInstruments.map((instrument) => instrument.minMidi));
        const gridMaxMidi = Math.max(...activeSelectedInstruments.map((instrument) => instrument.maxMidi));

        for (let u = -searchExtent; u <= searchExtent; u += 1) {
          for (let v = -searchExtent; v <= searchExtent; v += 1) {
            const midi = 60 + 7 * u + 4 * v;
            if (midi < gridMinMidi || midi > gridMaxMidi) {
              continue;
            }

            const pt = uvToPoint(u, v);
            if (!inBounds(pt.x, pt.y)) {
              continue;
            }

            const key = `${u},${v}`;
            const matchingInstruments = activeSelectedInstruments.filter((instrument) => midi >= instrument.minMidi && midi <= instrument.maxMidi);
            nodes.set(key, {
              key,
              u,
              v,
              midi,
              name: midiToName(midi),
              x: pt.x,
              y: pt.y,
              matchingInstruments
            });
          }
        }

        edgePairs = [];
        nodes.forEach((a) => {
          directions.forEach(([du, dv]) => {
            const b = nodeAt(a.u + du, a.v + dv);
            if (!b) {
              return;
            }
            edgePairs.push([a, b]);
          });
        });

        edgePairs.forEach(([a, b]) => {
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", a.x);
          line.setAttribute("y1", a.y);
          line.setAttribute("x2", b.x);
          line.setAttribute("y2", b.y);

          const centerDistance = Math.hypot((a.x + b.x) * 0.5 - CENTER_X, (a.y + b.y) * 0.5 - CENTER_Y);
          line.setAttribute("class", centerDistance < 260 ? "tri-line-strong" : "tri-line");
          edgeGroup.appendChild(line);

          edgeVisuals.push({
            key: pairKey(a.key, b.key),
            line
          });

          addNeighbor(a.key, b.key);
          addNeighbor(b.key, a.key);
        });

        const triangles = [];
        const triangleIds = new Set();

        nodes.forEach((node) => {
          const neighbors = adjacency.get(node.key) || [];
          for (let i = 0; i < neighbors.length; i += 1) {
            for (let j = i + 1; j < neighbors.length; j += 1) {
              const left = neighbors[i];
              const right = neighbors[j];
              const leftNeighbors = adjacency.get(left) || [];
              if (!leftNeighbors.includes(right)) {
                continue;
              }

              const nodeKeys = [node.key, left, right];
              const sortedId = [...nodeKeys].sort().join("|");
              if (triangleIds.has(sortedId)) {
                continue;
              }

              triangleIds.add(sortedId);
              triangles.push({ id: sortedId, nodeKeys });
            }
          }
        });

        triangles.forEach((triangle) => {
          const triangleNodes = triangle.nodeKeys
            .map((nodeKey) => nodes.get(nodeKey))
            .filter(Boolean);

          const points = triangleNodes.map((node) => `${node.x},${node.y}`).join(" ");

          const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          polygon.setAttribute("points", points);
          polygon.setAttribute("class", "tri-face");
          triangleGroup.appendChild(polygon);

          const uniqueSortedKeys = [...triangle.nodeKeys]
            .sort((left, right) => (nodes.get(left).midi - nodes.get(right).midi));

          const centroidX = triangleNodes.reduce((sum, node) => sum + node.x, 0) / triangleNodes.length;
          const centroidY = triangleNodes.reduce((sum, node) => sum + node.y, 0) / triangleNodes.length;

          const triadLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
          triadLabel.setAttribute("x", centroidX);
          triadLabel.setAttribute("y", centroidY + 0.3);
          triadLabel.setAttribute("class", "triad-label");
          triadLabel.textContent = formatTriadLabel(uniqueSortedKeys);
          triadTextGroup.appendChild(triadLabel);

          const record = {
            id: triangle.id,
            nodeKeys: uniqueSortedKeys,
            polygon,
            triadLabel
          };

          trianglesById.set(triangle.id, record);
          triangleVisuals.push(record);
        });

        nodes.forEach((n) => {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", n.x);
          circle.setAttribute("cy", n.y);
          circle.setAttribute("r", RADIUS);
          circle.setAttribute("class", "node");
          circle.setAttribute("filter", "url(#softShadow)");
          circle.setAttribute("data-note-name", n.name);
          nodeGroup.appendChild(circle);

          const ringClasses = n.matchingInstruments.map((instrument) => `range-ring ${instrument.colorClass}`);
          const ringElements = [];

          ringClasses.forEach((ringClass, idx) => {
            const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            ring.setAttribute("cx", n.x);
            ring.setAttribute("cy", n.y);
            ring.setAttribute("r", RADIUS + 3.1 + idx * 2.9);
            ring.setAttribute("class", ringClass);
            rangeGroup.appendChild(ring);
            ringElements.push(ring);
          });

          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", n.x);
          label.setAttribute("y", n.y + 0.4);
          label.setAttribute("class", "label");
          label.setAttribute("data-note-name", n.name);
          label.textContent = n.name;
          textGroup.appendChild(label);

          const hitTarget = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          hitTarget.setAttribute("cx", n.x);
          hitTarget.setAttribute("cy", n.y);
          hitTarget.setAttribute("r", RADIUS + 16);
          hitTarget.setAttribute("class", "node-hit-target");
          hitGroup.appendChild(hitTarget);

          nodeVisuals.push({
            key: n.key,
            pitchClass: ((n.midi % 12) + 12) % 12,
            displayName: n.name,
            noteName: n.name,
            core: circle,
            label,
            rings: ringElements,
            hitTarget
          });
        });

        const legend = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const legendItems = activeSelectedInstruments.length > 0 ? activeSelectedInstruments : instrumentDefinitions.slice(0, 4);

        legendItems.forEach((instrument, index) => {
          const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          const row = Math.floor(index / 4);
          const col = index % 4;
          ring.setAttribute("cx", width - 560 + col * 132);
          ring.setAttribute("cy", 58 + row * 24);
          ring.setAttribute("r", 10);
          ring.setAttribute("class", `range-ring ${instrument.colorClass}`);
          legend.appendChild(ring);

          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", width - 543 + col * 132);
          label.setAttribute("y", 58 + row * 24);
          label.setAttribute("class", "legend-label");
          label.textContent = instrument.label;
          legend.appendChild(label);
        });

        const footer = document.createElementNS("http://www.w3.org/2000/svg", "text");
        footer.setAttribute("x", 52);
        footer.setAttribute("y", height - 22);
        footer.setAttribute("class", "footer");
        footer.textContent = "Overlap notes show all selected instrument ring colors. Route and triad staves are rendered separately.";

        selectedNodeKeys = [];
        activePathKeys = [];
        selectedTriangleIds = [];
        routePlaybackEvents = [];
        triadPlaybackEvents = [];
        activeMode = previousMode;
        highlightedNoteName = null;
        previewNoteName = null;

        svg.appendChild(triangleGroup);
        svg.appendChild(triadTextGroup);
        svg.appendChild(edgeGroup);
        svg.appendChild(nodeGroup);
        svg.appendChild(rangeGroup);
        svg.appendChild(textGroup);
        svg.appendChild(hitGroup);
        svg.appendChild(legend);
        svg.appendChild(footer);

        nodeVisuals.forEach((visual) => {
          visualByKey.set(visual.key, visual);
        });

        maxRadius = Math.max(...Array.from(nodes.values(), (node) => Math.hypot(node.x - CENTER_X, node.y - CENTER_Y)));
        bindNodeInteractions();
        bindTriangleInteractions();
        updatePathView();
        updateTriadView();
        } catch (error) {
          console.error("renderGraph failed", error);
          if (svg) {
            svg.innerHTML = "";
          }
        }
      }

      let audioContext = null;
      let masterGain = null;
      let activeOscillators = [];
      let playbackToken = 0;

      // iOS Safari and other browsers require Web Audio to be unlocked on the
      // first user gesture before scheduling notes.
      document.addEventListener("pointerdown", function unlockAudio() {
        void resumeAudioEngine();
      }, { once: true });

      function ensureAudioEngine() {
        if (!audioContext) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) {
            interactionNote.textContent = "Audio playback is not supported in this browser.";
            return false;
          }

          audioContext = new Ctx();
          masterGain = audioContext.createGain();
          masterGain.gain.value = 0.35;
          masterGain.connect(audioContext.destination);
        }
        return true;
      }

      async function resumeAudioEngine() {
        if (!ensureAudioEngine()) {
          return false;
        }
        if (audioContext.state === "suspended") {
          try {
            await audioContext.resume();
          } catch (error) {
            interactionNote.textContent = "Audio playback could not start. Try tapping the page again or allowing audio in the browser.";
            return false;
          }
        }
        return true;
      }

      function midiToFrequency(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      function stopPlayback() {
        playbackToken += 1;
        activeOscillators.forEach(({ osc, gain }) => {
          try {
            if (gain && gain.gain) {
              gain.gain.cancelScheduledValues(0);
              gain.gain.setValueAtTime(0.0001, audioContext ? audioContext.currentTime : 0);
            }
            if (osc && osc.stop) {
              osc.stop();
            }
          } catch (error) {
            // Ignore stop errors for already-ended oscillators.
          }
        });
        activeOscillators = [];
      }

      function playWholeEvent(midis, startTime, durationSeconds) {
        if (!midis || midis.length === 0) {
          return;
        }

        const voiceGain = audioContext.createGain();
        const voiceLevel = Math.min(0.38, 0.38 / Math.sqrt(midis.length));
        voiceGain.gain.setValueAtTime(0.0001, startTime);
        voiceGain.gain.linearRampToValueAtTime(voiceLevel, startTime + 0.03);
        voiceGain.gain.setValueAtTime(voiceLevel, startTime + Math.max(0.06, durationSeconds - 0.08));
        voiceGain.gain.linearRampToValueAtTime(0.0001, startTime + durationSeconds);
        voiceGain.connect(masterGain);

        midis.forEach((midi) => {
          try {
            const osc = audioContext.createOscillator();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(midiToFrequency(midi), startTime);
            osc.connect(voiceGain);
            osc.start(startTime);
            osc.stop(startTime + durationSeconds + 0.02);
            activeOscillators.push({ osc, gain: voiceGain });
          } catch (error) {
            interactionNote.textContent = "Audio playback encountered a browser error. Please refresh and try again.";
          }
        });
      }

      async function playSelectedSource() {
        if (!(await resumeAudioEngine())) {
          return;
        }

        const source = playbackSourceSelect.value;
        const eventsToPlay = source === "triad" ? triadPlaybackEvents : routePlaybackEvents;
        if (eventsToPlay.length === 0) {
          interactionNote.textContent = source === "triad"
            ? "No triads selected for playback. Switch to Triad mode and tap triangles first."
            : "No route notes selected for playback. Add waypoints first.";
          return;
        }

        const bpm = Math.min(220, Math.max(40, Number(tempoBpmInput.value) || 84));
        tempoBpmInput.value = String(bpm);
        const wholeDuration = (60 / bpm) * 4;

        stopPlayback();
        const myToken = playbackToken;
        const startAt = audioContext.currentTime + 0.04;

        eventsToPlay.forEach((event, idx) => {
          playWholeEvent(event.midis, startAt + idx * wholeDuration, wholeDuration);
        });

        interactionNote.textContent = source === "triad"
          ? `Playing ${eventsToPlay.length} whole-note triad${eventsToPlay.length === 1 ? "" : "s"} at ${bpm} BPM.`
          : `Playing ${eventsToPlay.length} whole note${eventsToPlay.length === 1 ? "" : "s"} at ${bpm} BPM.`;

        const totalMs = Math.ceil(eventsToPlay.length * wholeDuration * 1000);
        window.setTimeout(() => {
          if (myToken !== playbackToken) {
            return;
          }
          activeOscillators = [];
          interactionNote.textContent = source === "triad"
            ? "Triad playback finished. Click Play to hear the triad staff again."
            : "Route playback finished. Click Play to hear the route again.";
        }, totalMs + 80);
      }

      function reconstructPath(previous, startKey, endKey) {
        if (!previous.has(endKey) && startKey !== endKey) {
          return [];
        }

        const path = [endKey];
        let cursor = endKey;
        while (cursor !== startKey) {
          const parent = previous.get(cursor);
          if (!parent) {
            return [];
          }
          path.push(parent);
          cursor = parent;
        }
        path.reverse();
        return path;
      }

      function shortestPath(startKey, endKey) {
        const queue = [startKey];
        const previous = new Map();
        const visited = new Set([startKey]);

        while (queue.length > 0) {
          const current = queue.shift();
          if (current === endKey) {
            break;
          }
          const neighbors = adjacency.get(current) || [];
          neighbors.forEach((nextKey) => {
            if (visited.has(nextKey)) {
              return;
            }
            visited.add(nextKey);
            previous.set(nextKey, current);
            queue.push(nextKey);
          });
        }

        return reconstructPath(previous, startKey, endKey);
      }

      function dijkstraPath(startKey, endKey, weightFn) {
        const distances = new Map();
        const previous = new Map();
        const frontier = [{ key: startKey, score: 0 }];

        distances.set(startKey, 0);

        while (frontier.length > 0) {
          frontier.sort((a, b) => a.score - b.score);
          const current = frontier.shift();
          if (current.key === endKey) {
            break;
          }
          if (current.score > (distances.get(current.key) ?? Infinity)) {
            continue;
          }

          const neighbors = adjacency.get(current.key) || [];
          neighbors.forEach((nextKey) => {
            const edgeCost = Math.max(0.12, weightFn(current.key, nextKey, endKey));
            const candidate = current.score + edgeCost;
            if (candidate < (distances.get(nextKey) ?? Infinity)) {
              distances.set(nextKey, candidate);
              previous.set(nextKey, current.key);
              frontier.push({ key: nextKey, score: candidate });
            }
          });
        }

        return reconstructPath(previous, startKey, endKey);
      }

      function smoothWeight(currKey, nextKey) {
        const curr = nodes.get(currKey);
        const next = nodes.get(nextKey);
        const stepMidi = Math.abs(next.midi - curr.midi);
        return 1 + stepMidi / 9;
      }

      function tensionWeight(currKey, nextKey, endKey) {
        const curr = nodes.get(currKey);
        const next = nodes.get(nextKey);
        const end = nodes.get(endKey);

        const nextRadiusNorm = Math.hypot(next.x - CENTER_X, next.y - CENTER_Y) / maxRadius;
        const nextMidiNorm = (next.midi - GRID_MIN_MIDI) / (GRID_MAX_MIDI - GRID_MIN_MIDI);
        const tensionScore = 0.6 * nextRadiusNorm + 0.4 * nextMidiNorm;

        const distanceToTarget = Math.hypot(next.x - end.x, next.y - end.y) / (SPACING * 10);
        const descendingPenalty = Math.max(0, curr.midi - next.midi) / 14;

        return 1.15 + distanceToTarget + descendingPenalty - 0.85 * tensionScore;
      }

      function buildPath(startKey, endKey) {
        if (!startKey || !endKey) {
          return [];
        }

        const mode = pathModeSelect.value;
        if (mode === "smooth") {
          return dijkstraPath(startKey, endKey, smoothWeight);
        }
        if (mode === "tension") {
          return dijkstraPath(startKey, endKey, tensionWeight);
        }
        return shortestPath(startKey, endKey);
      }

      function buildPathFromWaypoints(waypointKeys) {
        if (waypointKeys.length === 0) {
          return [];
        }
        if (waypointKeys.length === 1) {
          return [waypointKeys[0]];
        }

        const merged = [];
        for (let i = 0; i < waypointKeys.length - 1; i += 1) {
          const segment = buildPath(waypointKeys[i], waypointKeys[i + 1]);
          if (segment.length === 0) {
            return [];
          }

          if (i === 0) {
            merged.push(...segment);
          } else {
            merged.push(...segment.slice(1));
          }
        }

        return merged;
      }

      function clearPathState() {
        selectedNodeKeys = [];
        activePathKeys = [];
        highlightedNoteName = null;
        previewNoteName = null;
      }

      function clearTriadState() {
        selectedTriangleIds = [];
      }

      function routeStatusMessage() {
        if (selectedNodeKeys.length === 0) {
          return "Tap notes to add waypoints for a route.";
        }

        const startName = visualByKey.get(selectedNodeKeys[0]).displayName;
        if (selectedNodeKeys.length === 1) {
          return `Start ${startName} selected. Add more waypoints to extend the route.`;
        }

        const endName = visualByKey.get(selectedNodeKeys[selectedNodeKeys.length - 1]).displayName;
        const waypointCount = Math.max(0, selectedNodeKeys.length - 2);
        const modeLabel = pathModeSelect.options[pathModeSelect.selectedIndex].text;
        if (activePathKeys.length <= 1) {
          return "No route found through the current waypoint chain.";
        }

        return `${modeLabel} route: ${startName} to ${endName} with ${waypointCount} waypoint${waypointCount === 1 ? "" : "s"}, ${activePathKeys.length - 1} moves.`;
      }

      function triadStatusMessage() {
        if (selectedTriangleIds.length === 0) {
          return "Tap triangles to add triads.";
        }
        return `${selectedTriangleIds.length} triad${selectedTriangleIds.length === 1 ? "" : "s"} selected for the separate staff.`;
      }

      function updateInteractionMessage() {
        if (currentInteractionMode() === "route") {
          interactionNote.textContent = `Route mode — ${routeStatusMessage()} Switch to Triad mode to select triads.`;
        } else {
          interactionNote.textContent = `Triad mode — ${triadStatusMessage()} Switch to Route mode to build a route.`;
        }
      }

      function setMode(mode) {
        activeMode = mode;
        hitGroup.style.pointerEvents = mode === "triad" ? "none" : "";
        svg.classList.toggle("mode-triad", mode === "triad");
        updateInteractionMessage();
      }

      function updatePathView() {
        const pathEdges = new Set();
        for (let i = 0; i < activePathKeys.length - 1; i += 1) {
          pathEdges.add(pairKey(activePathKeys[i], activePathKeys[i + 1]));
        }
        const pathNodeSet = new Set(activePathKeys);
        const hasPath = activePathKeys.length > 1;

        edgeVisuals.forEach((edgeVisual) => {
          const onPath = pathEdges.has(edgeVisual.key);
          edgeVisual.line.classList.toggle("edge-muted", hasPath && !onPath);
          edgeVisual.line.classList.toggle("path-edge-active", onPath);
        });

        const matchedNoteName = previewNoteName ?? highlightedNoteName;

        nodeVisuals.forEach((visual) => {
          const onPath = pathNodeSet.has(visual.key);
          const isStart = selectedNodeKeys.length > 0 && visual.key === selectedNodeKeys[0];
          const isEnd = selectedNodeKeys.length > 1 && visual.key === selectedNodeKeys[selectedNodeKeys.length - 1];
          const isWaypoint = selectedNodeKeys.slice(1, -1).includes(visual.key);
          const visualNoteName = (visual.label.textContent || "").trim();
          const isSameNote = matchedNoteName !== null && visualNoteName === matchedNoteName;

          visual.core.classList.toggle("node-muted", hasPath && !onPath);
          visual.core.classList.toggle("node-path", onPath);
          visual.core.classList.toggle("node-start", isStart);
          visual.core.classList.toggle("node-end", isEnd);
          visual.core.classList.toggle("node-waypoint", isWaypoint);
          visual.core.classList.toggle("node-match", isSameNote);

          visual.label.classList.toggle("label-muted", hasPath && !onPath);
          visual.label.classList.toggle("label-path", onPath);
          visual.label.classList.toggle("label-start", isStart);
          visual.label.classList.toggle("label-end", isEnd);
          visual.label.classList.toggle("label-waypoint", isWaypoint);
          visual.label.classList.toggle("label-match", isSameNote);

          visual.rings.forEach((ring) => {
            ring.classList.toggle("range-ring-muted", hasPath && !onPath);
            ring.classList.toggle("range-ring-path", onPath);
            ring.classList.toggle("range-ring-match", isSameNote);
          });
        });

        let xmlKeys = [];
        if (activePathKeys.length > 0) {
          xmlKeys = activePathKeys;
        } else if (selectedNodeKeys.length > 0) {
          xmlKeys = [...selectedNodeKeys];
        }
        routePlaybackEvents = xmlKeys
          .map((key) => nodes.get(key))
          .filter(Boolean)
          .map((node) => ({ midis: [node.midi] }));

        void renderRouteMusicXmlFromKeys(xmlKeys);
        updateInteractionMessage();
      }

      function updateTriadView() {
        const selectedSet = new Set(selectedTriangleIds);

        triangleVisuals.forEach((triangleVisual) => {
          triangleVisual.triadLabel.textContent = formatTriadLabel(triangleVisual.nodeKeys);
          triangleVisual.polygon.classList.toggle("tri-face-selected", selectedSet.has(triangleVisual.id));
          triangleVisual.triadLabel.classList.toggle("triad-label-selected", selectedSet.has(triangleVisual.id));
        });

        triadPlaybackEvents = selectedTriangleIds
          .map((triangleId) => trianglesById.get(triangleId))
          .filter(Boolean)
          .map((triangle) => {
            const midis = triangle.nodeKeys
              .map((nodeKey) => nodes.get(nodeKey))
              .filter(Boolean)
              .map((node) => node.midi)
              .sort((a, b) => a - b);
            return { midis };
          });

        void renderTriadMusicXmlFromTriangleKeys(selectedTriangleIds);
        updateInteractionMessage();
      }

      function handleNodeSelection(event, visual) {
        if (event.cancelable) {
          event.preventDefault();
        }
        if (activeMode === "route") {
          event.stopPropagation();
        }
        if (activeMode !== "route" || event.shiftKey) {
          return;
        }

        const clickedKey = visual.key;
        const shouldRemove = selectedNodeKeys.length > 0 && clickedKey === selectedNodeKeys[selectedNodeKeys.length - 1];

        if (shouldRemove) {
          selectedNodeKeys.pop();
        } else {
          selectedNodeKeys.push(clickedKey);
        }

        const noteName = (visual.label.textContent || "").trim() || nodes.get(clickedKey)?.name || visual.noteName || null;
        previewNoteName = noteName;
        highlightedNoteName = noteName;
        activePathKeys = buildPathFromWaypoints(selectedNodeKeys);
        updatePathView();
        previewNoteName = null;
      }

      function showPreviewForVisual(visual) {
        if (selectedNodeKeys.length > 0) {
          return;
        }
        const noteName = (visual.label.textContent || "").trim() || visual.noteName || null;
        previewNoteName = noteName;
        updatePathView();
      }

      function clearPreviewForVisual() {
        if (selectedNodeKeys.length > 0) {
          return;
        }
        previewNoteName = null;
        updatePathView();
      }

      svg.addEventListener("touchend", clearPreviewForVisual, { passive: false });
      svg.addEventListener("touchcancel", clearPreviewForVisual, { passive: false });

      svg.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".node-hit-target")) {
          return;
        }
        if (event.target.closest(".tri-face")) {
          return;
        }
        if (event.target.closest(".node")) {
          return;
        }
        clearPathState();
        clearTriadState();
        updatePathView();
        updateTriadView();
      });

      pathModeSelect.addEventListener("change", () => {
        activePathKeys = buildPathFromWaypoints(selectedNodeKeys);
        updatePathView();
      });

      interactionModeSelect.addEventListener("change", () => {
        setMode(interactionModeSelect.value);
      });

      romanNumeralsToggle.addEventListener("change", () => {
        romanRootSelect.disabled = !romanNumeralsToggle.checked;
        updateTriadView();
      });

      romanRootSelect.addEventListener("change", () => {
        updateTriadView();
      });

      const refreshGraphFromSelection = () => {
        persistInstrumentSelection();
        clearPathState();
        clearTriadState();
        scheduleGraphRender();
      };

      instrumentSelection.addEventListener("change", refreshGraphFromSelection);
      instrumentSelection.addEventListener("input", refreshGraphFromSelection);
      instrumentSelection.addEventListener("click", refreshGraphFromSelection);
      instrumentSelection.addEventListener("pointerup", refreshGraphFromSelection);
      instrumentSelection.addEventListener("keyup", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          refreshGraphFromSelection();
        }
      });

      clearPathButton.addEventListener("click", () => {
        clearPathState();
        clearTriadState();
        updatePathView();
        updateTriadView();
      });

      playRouteButton.addEventListener("click", () => {
        void playSelectedSource();
      });

      stopRouteButton.addEventListener("click", () => {
        stopPlayback();
        interactionNote.textContent = "Playback stopped.";
      });

      window.__tonnetzRenderGraph = function () {
        const defs = svg.querySelector("defs");
        svg.replaceChildren(defs);

        triangleGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        triadTextGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        edgeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        rangeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        textGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        hitGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        nodeVisuals = [];
        triangleVisuals = [];
        edgeVisuals = [];
        adjacency = new Map();
        trianglesById = new Map();
        visualByKey = new Map();
        nodes = new Map();

        const activeSelectedInstruments = activeInstruments();
        if (activeSelectedInstruments.length === 0) {
          selectedNodeKeys = [];
          activePathKeys = [];
          selectedTriangleIds = [];
          routePlaybackEvents = [];
          triadPlaybackEvents = [];
          highlightedNoteName = null;
          previewNoteName = null;
        }

        const gridMinMidi = Math.min(...activeSelectedInstruments.map((instrument) => instrument.minMidi));
        const gridMaxMidi = Math.max(...activeSelectedInstruments.map((instrument) => instrument.maxMidi));

        for (let u = -searchExtent; u <= searchExtent; u += 1) {
          for (let v = -searchExtent; v <= searchExtent; v += 1) {
            const midi = 60 + 7 * u + 4 * v;
            if (midi < gridMinMidi || midi > gridMaxMidi) {
              continue;
            }

            const pt = uvToPoint(u, v);
            if (!inBounds(pt.x, pt.y)) {
              continue;
            }

            const key = `${u},${v}`;
            const matchingInstruments = activeSelectedInstruments.filter((instrument) => midi >= instrument.minMidi && midi <= instrument.maxMidi);
            nodes.set(key, {
              key,
              u,
              v,
              midi,
              name: midiToName(midi),
              x: pt.x,
              y: pt.y,
              matchingInstruments
            });
          }
        }

        edgePairs = [];
        nodes.forEach((a) => {
          directions.forEach(([du, dv]) => {
            const b = nodeAt(a.u + du, a.v + dv);
            if (!b) {
              return;
            }
            edgePairs.push([a, b]);
          });
        });

        edgePairs.forEach(([a, b]) => {
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", a.x);
          line.setAttribute("y1", a.y);
          line.setAttribute("x2", b.x);
          line.setAttribute("y2", b.y);
          const centerDistance = Math.hypot((a.x + b.x) * 0.5 - CENTER_X, (a.y + b.y) * 0.5 - CENTER_Y);
          line.setAttribute("class", centerDistance < 260 ? "tri-line-strong" : "tri-line");
          edgeGroup.appendChild(line);
          edgeVisuals.push({ key: pairKey(a.key, b.key), line });
          addNeighbor(a.key, b.key);
          addNeighbor(b.key, a.key);
        });

        const triangles = [];
        const triangleIds = new Set();

        nodes.forEach((node) => {
          const neighbors = adjacency.get(node.key) || [];
          for (let i = 0; i < neighbors.length; i += 1) {
            for (let j = i + 1; j < neighbors.length; j += 1) {
              const left = neighbors[i];
              const right = neighbors[j];
              const leftNeighbors = adjacency.get(left) || [];
              if (!leftNeighbors.includes(right)) {
                continue;
              }

              const nodeKeys = [node.key, left, right];
              const sortedId = [...nodeKeys].sort().join("|");
              if (triangleIds.has(sortedId)) {
                continue;
              }

              triangleIds.add(sortedId);
              triangles.push({ id: sortedId, nodeKeys });
            }
          }
        });

        triangles.forEach((triangle) => {
          const triangleNodes = triangle.nodeKeys
            .map((nodeKey) => nodes.get(nodeKey))
            .filter(Boolean);

          const points = triangleNodes.map((node) => `${node.x},${node.y}`).join(" ");

          const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          polygon.setAttribute("points", points);
          polygon.setAttribute("class", "tri-face");
          triangleGroup.appendChild(polygon);

          const uniqueSortedKeys = [...triangle.nodeKeys]
            .sort((left, right) => (nodes.get(left).midi - nodes.get(right).midi));

          const centroidX = triangleNodes.reduce((sum, node) => sum + node.x, 0) / triangleNodes.length;
          const centroidY = triangleNodes.reduce((sum, node) => sum + node.y, 0) / triangleNodes.length;

          const triadLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
          triadLabel.setAttribute("x", centroidX);
          triadLabel.setAttribute("y", centroidY + 0.3);
          triadLabel.setAttribute("class", "triad-label");
          triadLabel.textContent = formatTriadLabel(uniqueSortedKeys);
          triadTextGroup.appendChild(triadLabel);

          const record = {
            id: triangle.id,
            nodeKeys: uniqueSortedKeys,
            polygon,
            triadLabel
          };

          trianglesById.set(triangle.id, record);
          triangleVisuals.push(record);
        });

        nodes.forEach((n) => {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", n.x);
          circle.setAttribute("cy", n.y);
          circle.setAttribute("r", RADIUS);
          circle.setAttribute("class", "node");
          circle.setAttribute("filter", "url(#softShadow)");
          circle.setAttribute("data-note-name", n.name);
          nodeGroup.appendChild(circle);

          const ringElements = [];
          n.matchingInstruments.forEach((instrument, idx) => {
            const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            ring.setAttribute("cx", n.x);
            ring.setAttribute("cy", n.y);
            ring.setAttribute("r", RADIUS + 3.1 + idx * 2.9);
            ring.setAttribute("class", `range-ring ${instrument.colorClass}`);
            rangeGroup.appendChild(ring);
            ringElements.push(ring);
          });

          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", n.x);
          label.setAttribute("y", n.y + 0.4);
          label.setAttribute("class", "label");
          label.setAttribute("data-note-name", n.name);
          label.textContent = n.name;
          textGroup.appendChild(label);

          const hitTarget = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          hitTarget.setAttribute("cx", n.x);
          hitTarget.setAttribute("cy", n.y);
          hitTarget.setAttribute("r", RADIUS + 16);
          hitTarget.setAttribute("class", "node-hit-target");
          hitGroup.appendChild(hitTarget);

          nodeVisuals.push({
            key: n.key,
            pitchClass: ((n.midi % 12) + 12) % 12,
            displayName: n.name,
            noteName: n.name,
            core: circle,
            label,
            rings: ringElements,
            hitTarget
          });
        });

        interactionNote = document.createElementNS("http://www.w3.org/2000/svg", "text");
        interactionNote.setAttribute("class", "interaction-note");
        interactionNote.setAttribute("display", "none");
        interactionNote.setAttribute("aria-hidden", "true");
        textGroup.appendChild(interactionNote);

        const legend = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const legendItems = activeSelectedInstruments.length > 0 ? activeSelectedInstruments : instrumentDefinitions.slice(0, 4);
        legendItems.forEach((instrument, index) => {
          const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          const row = Math.floor(index / 4);
          const col = index % 4;
          ring.setAttribute("cx", width - 560 + col * 132);
          ring.setAttribute("cy", 58 + row * 24);
          ring.setAttribute("r", 10);
          ring.setAttribute("class", `range-ring ${instrument.colorClass}`);
          legend.appendChild(ring);

          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", width - 543 + col * 132);
          label.setAttribute("y", 58 + row * 24);
          label.setAttribute("class", "legend-label");
          label.textContent = instrument.label;
          legend.appendChild(label);
        });

        const footer = document.createElementNS("http://www.w3.org/2000/svg", "text");
        footer.setAttribute("x", 52);
        footer.setAttribute("y", height - 22);
        footer.setAttribute("class", "footer");
        footer.textContent = "Overlap notes show all selected instrument ring colors. Route and triad staves are rendered separately.";

        svg.appendChild(triangleGroup);
        svg.appendChild(triadTextGroup);
        svg.appendChild(edgeGroup);
        svg.appendChild(nodeGroup);
        svg.appendChild(rangeGroup);
        svg.appendChild(textGroup);
        svg.appendChild(hitGroup);
        svg.appendChild(legend);
        svg.appendChild(footer);

        nodeVisuals.forEach((visual) => {
          visualByKey.set(visual.key, visual);
        });

        maxRadius = Math.max(...Array.from(nodes.values(), (node) => Math.hypot(node.x - CENTER_X, node.y - CENTER_Y)));
        bindNodeInteractions();
        bindTriangleInteractions();
        updatePathView();
        updateTriadView();
      };

      renderGraph();
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      const isLocalPreview = ["127.0.0.1", "localhost"].includes(window.location.hostname);
      window.addEventListener("load", () => {
        if (isLocalPreview) {
          navigator.serviceWorker.getRegistrations().then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))).catch(() => {
            // Ignore unregister failures during local preview.
          });
          return;
        }

        navigator.serviceWorker.register("sw.js").catch(() => {
          // Service worker registration is best-effort; the app still works without it.
        });
      });
    }
  </script>
</body>
</html>
